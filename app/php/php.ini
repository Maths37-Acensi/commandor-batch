[PHP] 
engine = On 
short_open_tag = On 
asp_tags = Off 
precision = 14 
y2k_compliance = On 
output_buffering = Off 
zlib.output_compression = Off 
implicit_flush = Off 
unserialize_callback_func = 
serialize_precision = 100 
allow_call_time_pass_reference = On 
safe_mode = Off 
safe_mode_gid = Off 
safe_mode_include_dir = 
safe_mode_exec_dir = 
safe_mode_allowed_env_vars = PHP_ 
safe_mode_protected_env_vars = LD_LIBRARY_PATH 
disable_functions = 
disable_classes = 
expose_php = On 
max_execution_time = 60 
max_input_time = 60 
memory_limit = 128M 
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED 
display_errors = On 
display_startup_errors = On 
log_errors = Off 
log_errors_max_len = 1024 
ignore_repeated_errors = Off 
ignore_repeated_source = Off 
report_memleaks = On 
track_errors = Off 
html_errors = On 
arg_separator.output = "&amp;" 
variables_order = "GPCS" 
register_globals = Off 
register_long_arrays = Off 
register_argc_argv = On 
auto_globals_jit = On 
post_max_size = 128M 
magic_quotes_gpc = On 
magic_quotes_runtime = Off 
magic_quotes_sybase = Off 
auto_prepend_file = 
auto_append_file = 
default_mimetype = "text/html" 
doc_root = 
user_dir = 
extension_dir = "${PHP_HOME}/ext"
enable_dl = On 
cgi.force_redirect = 0 
file_uploads = On 
upload_tmp_dir = "${TEMP_HOME}" 
upload_max_filesize = 128M 
allow_url_fopen = On 
allow_url_include = Off 
default_socket_timeout = 60 
extension=php_bz2.dll 
extension=php_curl.dll 
extension=php_mbstring.dll 
extension=php_exif.dll 
extension=php_fileinfo.dll 
extension=php_gd2.dll 
extension=php_gettext.dll 
extension=php_imap.dll 
extension=php_mysql.dll 
extension=php_mysqli.dll 
extension=php_pdo_mysql.dll 
extension=php_pdo_odbc.dll 
extension=php_pdo_sqlite.dll 
extension=php_soap.dll 
extension=php_sockets.dll 
extension=php_sqlite.dll 
extension=php_sqlite3.dll 
extension=php_xmlrpc.dll 
[Date] 
[filter] 
[iconv] 
[intl] 
[sqlite] 
[sqlite3] 
[Pcre] 
[Pdo] 
[Pdo_mysql] 
pdo_mysql.cache_size = 2000 
pdo_mysql.default_socket="MySQL" 
[Phar] 
[Syslog] 
define_syslog_variables  = Off 
[mail function] 
SMTP = localhost 
smtp_port = 25 
mail.add_x_header = Off 
[SQL] 
sql.safe_mode = Off 
[ODBC] 
odbc.allow_persistent = On 
odbc.check_persistent = On 
odbc.max_persistent = -1 
odbc.max_links = -1 
odbc.defaultlrl = 4096 
odbc.defaultbinmode = 1 
[Interbase] 
ibase.allow_persistent = 1 
ibase.max_persistent = -1 
ibase.max_links = -1 
ibase.timestampformat = "%Y-%m-%d %H:%M:%S" 
ibase.dateformat = "%Y-%m-%d" 
ibase.timeformat = "%H:%M:%S" 
[MySQL] 
mysql.allow_local_infile = On 
mysql.allow_persistent = On 
mysql.cache_size = 2000 
mysql.max_persistent = -1 
mysql.max_links = -1 
mysql.default_port = 3306 
mysql.default_socket = "MySQL" 
mysql.default_host = 
mysql.default_user = 
mysql.default_password = 
mysql.connect_timeout = 60 
mysql.trace_mode = Off 
[MySQLi] 
mysqli.max_persistent = -1 
mysqli.allow_local_infile = On 
mysqli.allow_persistent = On 
mysqli.max_links = -1 
mysqli.cache_size = 2000 
mysqli.default_port = 3306 
mysqli.default_socket = "MySQL" 
mysqli.default_host = 
mysqli.default_user = 
mysqli.default_pw = 
mysqli.reconnect = Off 
[mysqlnd] 
mysqlnd.collect_statistics = On 
mysqlnd.collect_memory_statistics = Off 
[OCI8] 
[PostgreSQL] 
pgsql.allow_persistent = On 
pgsql.auto_reset_persistent = Off 
pgsql.max_persistent = -1 
pgsql.max_links = -1 
pgsql.ignore_notice = 0 
pgsql.log_notice = 0 
[Sybase-CT] 
sybct.allow_persistent = On 
sybct.max_persistent = -1 
sybct.max_links = -1 
sybct.min_server_severity = 10 
sybct.min_client_severity = 10 
[bcmath] 
bcmath.scale = 0 
[browscap] 
[Session] 
session.save_handler = files 
session.save_path = "${TEMP_HOME}" 
session.use_cookies = 1 
session.use_only_cookies = 0 
session.name = PHPSESSID 
session.auto_start = 0 
session.cookie_lifetime = 0 
session.cookie_path = / 
session.cookie_domain = 
session.cookie_httponly = 
session.serialize_handler = php 
session.gc_probability = 1 
session.gc_divisor = 100 
session.gc_maxlifetime = 1440 
session.bug_compat_42 = On 
session.bug_compat_warn = On 
session.referer_check = 
session.entropy_length = 0 
session.entropy_file = 
session.cache_limiter = nocache 
session.cache_expire = 180 
session.use_trans_sid = 0 
session.hash_function = 0 
session.hash_bits_per_character = 5 
url_rewriter.tags = "a=href,area=href,frame=src,input=src,form=,fieldset=" 
[MSSQL] 
mssql.allow_persistent = On 
mssql.max_persistent = -1 
mssql.max_links = -1 
mssql.min_error_severity = 10 
mssql.min_message_severity = 10 
mssql.compatability_mode = Off 
mssql.secure_connection = Off 
[Assertion] 
[COM] 
[mbstring] 
[gd] 
[exif] 
[Tidy] 
tidy.clean_output = Off 
[soap] 
soap.wsdl_cache_enabled=1 
soap.wsdl_cache_dir="${TEMP_HOME}" 
soap.wsdl_cache_ttl=86400 
soap.wsdl_cache_limit = 5 
[sysvshm] 
[ldap] 
ldap.max_links = -1 
[mcrypt] 
[dba] 
[FrontBase] 
[apc] 
apc.shm_segments = 1 
apc.shm_size = 128M 
apc.ttl = 7200 
apc.user_ttl = 7200 
apc.num_files_hint = 1024 
apc.enable_cli = 1 
[eAccelerator] 
eaccelerator.shm_size = "0" 
eaccelerator.cache_dir = "${TEMP_HOME}" 
eaccelerator.enable = "1" 
eaccelerator.debug = 0 
eaccelerator.check_mtime = "1" 
eaccelerator.filter = "" 
eaccelerator.shm_max = "0" 
eaccelerator.shm_ttl = "0" 
eaccelerator.shm_prune_period = "0" 
eaccelerator.shm_only = "0" 
[XDebug] 
xdebug.profiler_append = 0 
xdebug.profiler_enable = 0 
xdebug.profiler_enable_trigger = 0 
xdebug.profiler_output_dir = "${TEMP_HOME}" 
xdebug.profiler_output_name = "xdebug_profile.%p" 
xdebug.trace_output_dir = "${TEMP_HOME}" 
[xsl] 
