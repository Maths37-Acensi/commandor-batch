#
# This is the main Apache HTTP server configuration file.  It contains the
# configuration directives that give the server its instructions.
# See <URL:http://httpd.apache.org/docs/2.4/> for detailed information.
# In particular, see <URL:http://httpd.apache.org/docs/2.4/mod/directives.html>
# for a discussion of each configuration directive.
#

Define SRVROOT "${APACHE_HOME}"

ServerRoot "${SRVROOT}"

Listen 80
Listen 443

#
# Dynamic Shared Object (DSO) Support
#
LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule allowmethods_module modules/mod_allowmethods.so
LoadModule asis_module modules/mod_asis.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule cgi_module modules/mod_cgi.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule include_module modules/mod_include.so
LoadModule isapi_module modules/mod_isapi.so
LoadModule logio_module modules/mod_logio.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule log_debug_module modules/mod_log_debug.so
LoadModule mime_module modules/mod_mime.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_html_module modules/mod_proxy_html.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule xml2enc_module modules/mod_xml2enc.so

LoadModule php5_module "${PHP_HOME}/php5apache2_4.dll"
PHPIniDir "${PHP_HOME}"

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

#
# ServerAdmin
#
ServerAdmin pg@acensi.fr

#
# Un seul ServerName global
#
#ServerName BLO-COMMANDOR.blo-prod.local

# Alignement avec la prod ?
ServerName localhost:80
ServerName blo-commandor:80
ServerName localhost:443
ServerName blo-commandor:443


#
# Deny access to the entirety of your server's filesystem.
#
<Directory />
    AllowOverride none
    Require all denied
</Directory>

#
# Global document root
#
DocumentRoot "${APP_HOME}/www"

<Directory "${APP_HOME}/www">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

#
# DirectoryIndex
#
<IfModule dir_module>
    DirectoryIndex index.html index.php
</IfModule>

#
# Protect .ht* files
#
<Files ".ht*">
    Require all denied
</Files>

#
# Logs
#
ErrorLog "|${APACHE_HOME}/bin/rotatelogs.exe -l -n 20 ${LOG_HOME}/apache/error.log 20M"

LogLevel debug proxy:info rewrite:info

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
        LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    CustomLog "|${APACHE_HOME}/bin/rotatelogs.exe -l -n 20 ${LOG_HOME}/apache/access.log 20M" common
</IfModule>

#
# CGI
#
<IfModule alias_module>
    ScriptAlias /cgi-bin/ "${SRVROOT}/cgi-bin/"
</IfModule>

<Directory "${SRVROOT}/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

#
# Headers
#
<IfModule headers_module>
    RequestHeader unset Proxy early
</IfModule>

#
# MIME
#
<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType application/x-httpd-php .php
</IfModule>

#
# Supplemental configuration
#

# Virtual hosts externes désactivés pour éviter les doublons
# Include conf/extra/httpd-vhosts.conf

# Configure mod_proxy_html to understand HTML4/XHTML1
<IfModule proxy_html_module>
    Include conf/extra/httpd-proxy.conf
</IfModule>

#
# Secure (SSL/TLS) connections
#
<IfModule ssl_module>
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin

	<VirtualHost *:443>
        SSLEngine On
        SSLCertificateFile    "${SSL_HOME}/BLO-COMMANDOR.blo-prod.local.crt"
        SSLCertificateKeyFile "${SSL_HOME}/BLO-COMMANDOR.blo-prod.local.key"
    </VirtualHost>

    #<VirtualHost *:443>
    #    ServerName BLO-COMMANDOR.blo-prod.local

    #    SSLEngine On
    #    SSLCertificateFile    "${SSL_HOME}/BLO-COMMANDOR.blo-prod.local.crt"
    #    SSLCertificateKeyFile "${SSL_HOME}/BLO-COMMANDOR.blo-prod.local.key"

    #    DocumentRoot "${APP_HOME}/www"

    #    <Directory "${APP_HOME}/www">
    #        Options Indexes FollowSymLinks
    #        AllowOverride All
    #        Require all granted
    #    </Directory>
    #</VirtualHost>
</IfModule>